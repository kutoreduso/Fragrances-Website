<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../dist/output.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <body class="overflow-x-hidden text-[#e7e7e7] bg-[#2a2a2a] p-5 relative">
        <div class="relative">
    <div class="flex p-5 md:flex-nowrap flex-wrap justify-between md:w-full gap-4 relative">
            <h1 class="md:justify-center font-medium font-mono">Title</h1>
            <div class="md:justify-end flex flex-wrap gap-2">
                <a href="" class="border-2 rounded-2xl px-2">Button1</a>
                <a href="" class="border-2 rounded-2xl px-2">Button1</a>
                <a href="" class="border-2 rounded-2xl px-2">About</a>
            </div>
        </div>
    <div class="justify-center p-5 text-5xl font-bold font-mono">
        <h1 class=""></h1>
    </div>
  <div class="flex flex-nowrap relative">
    <div class="group flex flex-col items-center cursor-pointer">
        
        <h1 class="text-2xl font-bold mb-2 opacity-0 translate-y-4 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500 ease-out">
            Afnan Supremacy
        </h1>
        
        <img src="../img/afnan-supremacy-collectors-edition-is-worth-the-hype-v0-wvajbceltrdf1.webp" 
             alt="Presentation Image" 
             class="w-72 h-auto rounded-lg shadow-md z-10 relative"
             onclick="openPresentation()">
        
        <p class="mt-2 text-gray-700 opacity-0 -translate-y-4 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-500 ease-out">
            Collector's Edition Review
        </p>

    </div>
</div>


<div id="presentationOverlay" class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-500">
    
    <button onclick="closePresentation()" class="absolute top-6 right-8 text-white text-4xl font-light hover:text-gray-400 transition-colors">
        &times;
    </button>
    
    <h1 id="modalTitle" class="text-5xl font-bold text-white mb-8 -translate-y-10 transition-transform duration-700 ease-out">
        Afnan Supremacy
    </h1>
    
    <img src="../img/afnan-supremacy-collectors-edition-is-worth-the-hype-v0-wvajbceltrdf1.webp" 
         alt="Presentation Image Large" 
         class="max-w-4xl max-h-[60vh] w-auto h-auto rounded-xl shadow-2xl">
         
    <p id="modalText" class="mt-8 text-xl text-gray-300 max-w-2xl text-center translate-y-10 transition-transform duration-700 ease-out">
        Collector's Edition Review
    </p>

</div>


<script>
    const overlay = document.getElementById('presentationOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');

    function openPresentation() {
        // Show the dark overlay
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-100', 'pointer-events-auto');
        
        // Trigger the presentation slide-in animations
        setTimeout(() => {
            modalTitle.classList.remove('-translate-y-10');
            modalTitle.classList.add('translate-y-0');
            
            modalText.classList.remove('translate-y-10');
            modalText.classList.add('translate-y-0');
        }, 100); // small delay makes the animation feel smoother
    }

    function closePresentation() {
        // Hide the overlay
        overlay.classList.remove('opacity-100', 'pointer-events-auto');
        overlay.classList.add('opacity-0', 'pointer-events-none');
        
        // Reset the text positions so they can slide in next time
        setTimeout(() => {
            modalTitle.classList.remove('translate-y-0');
            modalTitle.classList.add('-translate-y-10');
            
            modalText.classList.remove('translate-y-0');
            modalText.classList.add('translate-y-10');
        }, 500); // wait for fade out to finish before resetting
    }
</script>

    </body>
</body>
</html>
